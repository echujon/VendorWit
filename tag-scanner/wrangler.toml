name = "tag-scanner"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

# Once wrangler.toml exists for a Pages project, Cloudflare treats it as the
# source of truth for plain (non-secret) environment variables and locks
# the dashboard's Environment Variables screen down to Secrets only - so
# SQUARE_ENVIRONMENT (not sensitive) has to live here, while
# SQUARE_ACCESS_TOKEN (sensitive) stays a dashboard-managed Secret.
[vars]
SQUARE_ENVIRONMENT = "production"
# Must match byte-for-byte what's registered as the Notification URL for the
# webhook subscription in the Square Developer Dashboard (including
# https:// and no trailing slash) - update this if the deployed domain
# ever changes, and update the subscription in Square to match.
SQUARE_WEBHOOK_NOTIFICATION_URL = "https://vendortools.pages.dev/api/webhooks/square"
# Square's Application ID for this app's OAuth ("Connect with Square") flow
# - not sensitive, same value shown in the Square Developer Dashboard's
# OAuth settings. The matching SQUARE_OAUTH_CLIENT_SECRET *is* sensitive
# and stays a dashboard-managed Secret, alongside a new
# SQUARE_OAUTH_ENCRYPTION_KEY Secret (generate with `openssl rand -base64
# 32`) used to encrypt stored per-organization tokens at rest - see
# functions/_shared/crypto.js and functions/_shared/square.js.
SQUARE_OAUTH_CLIENT_ID = "sq0idp-bmDUDiEKmuvccx_2bohJcQ"

# Consignment registration (functions/_shared/email.js) sends a one-time
# login code by email - not configured yet. Once a provider is chosen,
# uncomment EMAIL_PROVIDER below ("resend" or "smtp2go") and add the
# matching FROM_EMAIL var here, plus the provider's API key as a
# dashboard-managed Secret (RESEND_API_KEY or SMTP2GO_API_KEY) - same
# convention as SQUARE_ACCESS_TOKEN. Until then, request-code.js still
# works end-to-end except the actual send (logs the code instead - see
# README.md's "Consignment registration" section).
# EMAIL_PROVIDER = "resend"
# RESEND_FROM_EMAIL = "registration@yourdomain.com"
EMAIL_PROVIDER = "smtp2go"
SMTP2GO_FROM_EMAIL = "registration@vendorwit.com"

# TerminalQueue coordinates a shared pool of Square Terminals across
# multiple simultaneous app instances. A Pages project can't self-host a
# Durable Object class - Cloudflare requires it to live in a separately
# deployed Worker, referenced here by script_name. That Worker is
# ../terminal-queue-worker/ (deploy it once with `wrangler deploy` from
# that directory, and again whenever its code changes - it does NOT
# auto-deploy from this Pages project's git integration).
[[durable_objects.bindings]]
name = "TERMINAL_QUEUE"
class_name = "TerminalQueue"
script_name = "vendorwit-terminal-queue"
# Lets `wrangler pages dev` talk to the real deployed Durable Object instead
# of trying (and failing) to simulate an external Worker locally - D1 above
# still runs fully local. Remove this before a real deploy if you'd rather
# it resolve normally there (it should be a no-op in production either way).
experimental_remote = true

# Shared inventory, scoped per location (organizations -> locations -> items).
# One-time setup: `wrangler d1 create vendorwit-inventory` from this
# directory, then paste the database_id it prints below. Apply the schema
# with `wrangler d1 migrations apply vendorwit-inventory --remote`
# (drop --remote for local dev). Unlike the Durable Object above, D1
# bindings work directly in a Pages project - no separate Worker needed.
[[d1_databases]]
binding = "DB"
database_name = "vendorwit-inventory"
database_id = "fca4ab12-67d4-49ae-ad33-44e1166af2f0"
migrations_dir = "migrations"
