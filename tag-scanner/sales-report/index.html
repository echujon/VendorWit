<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Sales Report — Tag Scanner</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/" class="icon-btn" title="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <h1>Sales Report</h1>
    <div style="width:34px"></div>
  </header>

  <main style="padding:1.25rem;">
    <div class="scan-mode-toggle" role="group" aria-label="Report view" style="margin-bottom:0.75rem;">
      <button type="button" class="scan-mode-btn active" id="btn-sales-report-view-sale" data-view="sale">By Sale</button>
      <button type="button" class="scan-mode-btn" id="btn-sales-report-view-item" data-view="item">By Item (Sold/Unsold)</button>
    </div>
    <div id="sales-report-summary" class="sales-report-summary"></div>
    <div id="sales-report-category-chart" class="sales-report-category-chart"></div>
    <div class="sales-report-controls">
      <select id="sales-report-filter-vendor">
        <option value="">All sub-vendors</option>
      </select>
      <select id="sales-report-filter-method">
        <option value="">All payment methods</option>
        <option value="cash">Cash</option>
        <option value="venmo">Venmo</option>
        <option value="card">Card (Terminal)</option>
        <option value="other">Other / Quick Sale</option>
      </select>
    </div>
    <button class="btn btn-outline" id="btn-sales-report-export" style="font-size:0.8rem;padding:0.35rem 0.75rem;margin-bottom:0.75rem;">Export CSV</button>
    <div id="sales-report-list"></div>
  </main>

  <div id="toast"></div>

  <script type="module" src="/sales-report/app.js"></script>
</body>
</html>
