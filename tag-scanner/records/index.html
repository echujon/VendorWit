<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Records — Tag Scanner</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/" class="icon-btn" title="Back to scanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <h1>Records</h1>
    <div style="width:34px"></div>
  </header>

  <main>
    <div id="records-section" class="records-page">
      <h2>
        <span id="records-count">Records</span>
        <span style="display:flex;gap:0.5rem;">
          <button class="btn btn-outline" id="btn-seed-test" style="display:none;font-size:0.8rem;padding:0.35rem 0.75rem;">Seed Test Data</button>
          <a class="btn btn-outline" href="/sales-report" style="font-size:0.8rem;padding:0.35rem 0.75rem;text-decoration:none;display:inline-flex;align-items:center;">Sales Report</a>
          <button class="btn btn-outline" id="btn-export" style="font-size:0.8rem;padding:0.35rem 0.75rem;">Export CSV</button>
        </span>
      </h2>
      <input type="text" id="records-search" class="records-search" placeholder="Search records by ID, name, brand, sub-vendor, location...">
      <div id="records-list"><div class="empty-state">Loading...</div></div>
    </div>
  </main>

  <div id="toast"></div>
  <script type="module" src="/records/app.js"></script>
</body>
</html>
